      - launchApp:
          appId: com.hp.impulse.panorama
          clearState: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Get Started"
          optional: true
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 25000
      - scrollUntilVisible:
          element:
            text: "Sign up"
            below: "By signing up you agree to our Terms & Conditions and Privacy Policy"
          direction: DOWN
          timeout: 20000
      - tapOn:
          text: "Sign up"
          below: "By signing up you agree to our Terms & Conditions and Privacy Policy"
      - scroll
      - assertVisible:
          text: ".*(?i)(required|enter|empty|invalid|fix|field|problem|issue).*"
      - assertVisible: "Full name"

