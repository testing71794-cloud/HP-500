# =============================================================================
# HP 500 Panorama (Sprocket Panorama) - Signup module Maestro flows
# App ID: com.hp.impulse.panorama
# ATP source: HP 500 (Sprocket Panorama) ATP (4).xlsx (map IDs below to your sheet)
# -----------------------------------------------------------------------------
# Test data (replace for CI; keep signup email unique per run if backend enforces uniqueness)
#   SIGNUP_FULL_NAME / SIGNUP_EMAIL / SIGNUP_PASSWORD : positive path defaults
# -----------------------------------------------------------------------------
appId: com.hp.impulse.panorama
name: "HP Panorama - Signup module (ATP-mapped suite)"
tags:
  - hp-panorama
  - signup
  - regression
---
# -----------------------------------------------------------------------------
# ATP ID: HP-PAN-ATP-SUP-UI-001
# Title: Sign up screen — primary UI, fields, and legal copy are visible
# -----------------------------------------------------------------------------
- runFlow:
    label: "HP-PAN-ATP-SUP-UI-001 | Sign up screen UI"
    commands:
      - launchApp:
          appId: com.hp.impulse.panorama
          clearState: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Get Started"
          optional: true
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 25000
      - assertVisible: "Let creativity roll!"
      - assertVisible: "Create up to 9"
      - assertVisible: "Full name"
      - assertVisible: "Email"
      - assertVisible: "Password"
      - assertVisible: "By signing up you agree to our Terms & Conditions and Privacy Policy"
      - assertVisible: "Terms & Conditions"
      - assertVisible: "Privacy Policy"
      - scrollUntilVisible:
          element:
            text: "Sign up"
            below: "By signing up you agree to our Terms & Conditions and Privacy Policy"
          direction: DOWN
          timeout: 20000
      - assertVisible: "I already have an account"
      - assertVisible: "I'll do it later"

# -----------------------------------------------------------------------------
# ATP ID: HP-PAN-ATP-SUP-POS-001
# Title: Sign up — successful registration with valid data
# -----------------------------------------------------------------------------
- runFlow:
    label: "HP-PAN-ATP-SUP-POS-001 | Valid signup"
    commands:
      - launchApp:
          appId: com.hp.impulse.panorama
          clearState: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Get Started"
          optional: true
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 25000
      - tapOn: "Full name"
      - inputText: "HP Panorama Maestro QA"
      - tapOn: "Email"
      - inputText: "hp500.maestro.signup.atp.pos001.20260505@yopmail.com"
      - tapOn: "Password"
      - inputText: "HP_Panorama_Signup_Valid_01!"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            text: "Sign up"
            below: "By signing up you agree to our Terms & Conditions and Privacy Policy"
          direction: DOWN
          timeout: 20000
      - tapOn:
          text: "Sign up"
          below: "By signing up you agree to our Terms & Conditions and Privacy Policy"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible: "Let creativity roll!"
          timeout: 90000
      - assertVisible:
          text: ".*(?i)(welcome|verify|confirm|check|email|success|continue|next|connect|setup).*"
          optional: true

# -----------------------------------------------------------------------------
# ATP ID: HP-PAN-ATP-SUP-NEG-001
# Title: Sign up — empty Full name, Email, and Password are rejected
# -----------------------------------------------------------------------------
- runFlow:
    label: "HP-PAN-ATP-SUP-NEG-001 | Empty all fields"
