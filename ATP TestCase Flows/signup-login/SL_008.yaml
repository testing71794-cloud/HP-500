# ATP ID: SL_008
# Description: Password Warning Message Sign In
# Excel SL row: 8
# sl_test_number: 7

appId: com.hp.impulse.panorama
env:
  SL_VALID_EMAIL: "qa.hp500.sl.valid@hpqa.test"

name: "SL_008 - Password Warning Message Sign In"
tags:
  - hp-panorama
  - atp
  - SL_008
  - test-7
  - login
  - negative
---
- launchApp:
    appId: com.hp.impulse.panorama
    clearState: true
- runFlow: subflows/reach_login_from_cold_start.yaml
- tapOn: "Email"
- inputText: "${SL_VALID_EMAIL}"
- tapOn: "Password"
- inputText: "Testpass"
- hideKeyboard
- tapOn:
    text: "Login"
    below: "Forgot password"
- waitForAnimationToEnd
- assertVisible:
    text: "You have entered an invalid email address or password"
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Ok"
    optional: true
- assertVisible: "Login"
