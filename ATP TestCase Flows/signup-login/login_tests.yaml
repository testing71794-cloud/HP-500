# =============================================================================
# HP 500 Panorama (Sprocket Panorama) - Login module Maestro flows
# App ID: com.hp.impulse.panorama
# ATP source: HP 500 (Sprocket Panorama) ATP (4).xlsx (map IDs below to your sheet)
# -----------------------------------------------------------------------------
# Test data (replace with environment-backed accounts for CI)
#   VALID_LOGIN_EMAIL / VALID_LOGIN_PASSWORD : must authenticate successfully
# -----------------------------------------------------------------------------
appId: com.hp.impulse.panorama
name: "HP Panorama - Login module (ATP-mapped suite)"
tags:
  - hp-panorama
  - login
  - regression
---
# -----------------------------------------------------------------------------
# ATP ID: HP-PAN-ATP-LGN-UI-001
# Title: Login screen — primary UI and copy are visible after navigation
# -----------------------------------------------------------------------------
- runFlow:
    label: "HP-PAN-ATP-LGN-UI-001 | Login screen UI"
    commands:
      - launchApp:
          appId: com.hp.impulse.panorama
          clearState: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Get Started"
          optional: true
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 25000
      - assertVisible: "Let creativity roll!"
      - tapOn: "I already have an account"
      - extendedWaitUntil:
          visible: "Login"
          timeout: 20000
      - assertVisible: "Email"
      - assertVisible: "Password"
      - assertVisible: "Forgot password"
      - assertVisible:
          text: "Login"
          below: "Forgot password"

# -----------------------------------------------------------------------------
# ATP ID: HP-PAN-ATP-LGN-NAV-001
# Title: Login — back navigation returns to Sign up
# -----------------------------------------------------------------------------
- runFlow:
    label: "HP-PAN-ATP-LGN-NAV-001 | Back to Sign up"
    commands:
      - launchApp:
          appId: com.hp.impulse.panorama
          clearState: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Get Started"
          optional: true
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 25000
      - tapOn: "I already have an account"
      - extendedWaitUntil:
          visible: "Login"
          timeout: 20000
      - back
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 15000
      - assertVisible: "Full name"
      - assertVisible: "Email"
      - assertVisible: "Password"

# -----------------------------------------------------------------------------
# ATP ID: HP-PAN-ATP-LGN-POS-001
# Title: Login — successful authentication with valid credentials
# -----------------------------------------------------------------------------
- runFlow:
    label: "HP-PAN-ATP-LGN-POS-001 | Valid credentials"
    commands:
      - launchApp:
          appId: com.hp.impulse.panorama
          clearState: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Get Started"
          optional: true
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 25000
      - tapOn: "I already have an account"
      - extendedWaitUntil:
          visible: "Login"
          timeout: 20000
      - tapOn: "Email"
      - inputText: "qa.panorama.login.valid@hpqa.test"
      - tapOn: "Password"
      - inputText: "HP_Panorama_QA_Valid_01!"
      - hideKeyboard
      - tapOn:
          text: "Login"
          below: "Forgot password"
      - extendedWaitUntil:
          notVisible: "Forgot password"
          timeout: 45000
      - waitForAnimationToEnd
      - assertNotVisible: "Forgot password"

# -----------------------------------------------------------------------------
# ATP ID: HP-PAN-ATP-LGN-NEG-001
# Title: Login — empty Email and Password show validation / blocked submit
# -----------------------------------------------------------------------------
- runFlow:
    label: "HP-PAN-ATP-LGN-NEG-001 | Empty fields"
    commands:
      - launchApp:
          appId: com.hp.impulse.panorama
          clearState: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Get Started"
          optional: true
      - extendedWaitUntil:
          visible: "Sign up"
          timeout: 25000
      - tapOn: "I already have an account"
      - extendedWaitUntil:
          visible: "Login"
          timeout: 20000
      - tapOn:
          text: "Login"
          below: "Forgot password"
      - scroll
      - assertVisible:
          text: ".*(?i)(required|enter|empty|invalid|fix|field|problem|issue).*"
      - assertVisible: "Forgot password"

